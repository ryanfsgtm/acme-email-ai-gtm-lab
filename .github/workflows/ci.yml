name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run attio:export
      - run: npm run attio:plan
      - run: node --check workshop/public/app.js
      - run: node --check workshop/public/instructor.js
      - run: npx wrangler deploy --dry-run
