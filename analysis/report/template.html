<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sentiment and product insights from ACME Email sales and customer calls, with every finding traced to the calls and lines behind it.">
  <title>ACME Email call review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    // Load the fonts without blocking first paint; the page renders in the fallback stack until they arrive.
    (function () {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap';
      document.head.appendChild(link);
    })();
  </script>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>
  <style>{{STYLES}}</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="Call review home">
      <span class="brand-mark">FSGTM</span>
      <span><strong>AI in GTM School</strong><small>Call review</small></span>
    </a>
    <span class="header-note">ACME Email &middot; synthetic calls</span>
  </header>
  <main id="view" data-route="{{SSR_ROUTE}}">{{SSR}}</main>
  <footer>
    <span>Generated {{BUILT}} from <code>{{DATABASE}}</code></span>
    <span>ACME Email and every account in these calls are fictional.</span>
  </footer>
  <script type="application/octet-stream" id="report-data">{{DATA}}</script>
  <script type="application/octet-stream" id="report-transcripts">{{TRANSCRIPTS}}</script>
  <script>{{VIEW}}</script>
  <script>{{CLIENT}}</script>
</body>
</html>
